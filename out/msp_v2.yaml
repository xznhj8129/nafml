          description: 'Enum (`rangefinderType_e`): Rangefinder hardware type (`rangefinderConfig()->rangefinder_hardware`). 0 if `USE_RANGEFINDER` disabled'

        opflowHardware:
          type: opticalFlowSensor_e
          description: 'Enum (`opticalFlowSensor_e`): Optical flow hardware type (`opticalFlowConfig()->opflow_hardware`). 0 if `USE_OPFLOW` disabled'

  MSP_SET_SENSOR_CONFIG:
    id: 97
    description: Sets the configured hardware type for various sensors. Expects 6 bytes.
    request:
