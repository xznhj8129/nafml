        pitchToThrottle:
          type: uint8
          unit: us/deg
          description: "Sets `currentBatteryProfileMutable->nav.fw.pitch_to_throttle` (PWM microseconds per degree; 10 units \u2248 1% throttle)."

        loiterRadius:
          type: uint16
          unit: cm
          description: Sets `navConfigMutable()->fw.loiter_radius`.
    reply: null

  MSP_MODE_RANGES:
    id: 34
    description: Returns all defined mode activation ranges (aux channel assignments for flight modes). The number of steps and mapping to PWM values depends on internal range calculations.
    request: null
    reply:
      repeat: MAX_MODE_ACTIVATION_CONDITION_COUNT
      fields:
        modePermanentId:
          type: uint8
          unit: ID
          description: Permanent ID of the flight mode (maps to `boxId` via `findBoxByActiveBoxId`). 0 if entry unused

        auxChannelIndex:
          type: uint8
          unit: Index
          description: 0-based index of the AUX channel used for activation

        rangeStartStep:
          type: uint8
          unit: step
          description: Start step (0-48). Each step is 25 PWM units; 0 is <=900 and 48 is >=2100.

        rangeEndStep:
          type: uint8
          unit: step
          description: End step (0-48). Uses the same 25-PWM step mapping as rangeStartStep.

  MSP_SET_MODE_RANGE:
    id: 35
    description: Sets a single mode activation range by its index. Expects 5 bytes. Updates the mode configuration and recalculates used mode flags. Returns error if `rangeIndex` or `modePermanentId` is invalid.
    request:
      fields:
        rangeIndex:
          type: uint8
          unit: Index
          description: Index of the mode range to set (0 to `MAX_MODE_ACTIVATION_CONDITION_COUNT - 1`)

        modePermanentId:
          type: uint8
          unit: ID
          description: Permanent ID of the flight mode to assign

        auxChannelIndex:
          type: uint8
          unit: Index
          description: 0-based index of the AUX channel

        rangeStartStep:
          type: uint8
          unit: step
          description: Start step (0-48). Each step is 25 PWM units; 0 is <=900 and 48 is >=2100.

        rangeEndStep:
          type: uint8
          unit: step
          description: End step (0-48). Uses the same 25-PWM step mapping as rangeStartStep.
    reply: null

  MSP_FEATURE:
    id: 36
    description: Returns a bitmask of enabled features. Feature bits are defined in `feature.h`.
    request: null
    reply:
      fields:
        featureMask:
          type: uint32
          unit: Bitmask
          description: 'Bitmask: active features (see `featureMask()`)'

  MSP_SET_FEATURE:
    id: 37
    description: Sets the enabled features using a bitmask. Clears all previous features first. Expects 4 bytes. Updates feature configuration and related settings (e.g., RSSI source).
    request:
      fields:
        featureMask:
          type: uint32
          unit: Bitmask
          description: 'Bitmask: features to enable'
    reply: null

  MSP_BOARD_ALIGNMENT:
    id: 38
    description: "Returns the sensor board alignment angles relative to the craft frame. Ranges are typically -1800 to +1800 (i.e. -180.0\xB0 to +180.0\xB0)."
    request: null
    reply:
      fields:
        rollAlign:
          type: int16
          unit: deci-degrees
          description: Board alignment roll angle (`boardAlignment()->rollDeciDegrees`). Negative values tilt left.

        pitchAlign:
          type: int16
          unit: deci-degrees
          description: Board alignment pitch angle (`boardAlignment()->pitchDeciDegrees`). Negative values nose down.

        yawAlign:
          type: int16
          unit: deci-degrees
          description: Board alignment yaw angle (`boardAlignment()->yawDeciDegrees`). Negative values rotate counter-clockwise.

  MSP_SET_BOARD_ALIGNMENT:
    id: 39
    description: Sets the sensor board alignment angles. Expects 6 bytes encoded as little-endian signed deci-degrees (-1800 to +1800 typical).
    request:
      fields:
        rollAlign:
          type: int16
          unit: deci-degrees
          description: Sets `boardAlignmentMutable()->rollDeciDegrees`.

        pitchAlign:
          type: int16
          unit: deci-degrees
          description: Sets `boardAlignmentMutable()->pitchDeciDegrees`.

        yawAlign:
          type: int16
          unit: deci-degrees
          description: Sets `boardAlignmentMutable()->yawDeciDegrees`.
    reply: null

  MSP_CURRENT_METER_CONFIG:
    id: 40
    description: Retrieves the configuration for the current sensor. Scale and offset are signed values matching `batteryMetersConfig()->current` fields.
    request: null
    reply:
      fields:
        scale:
          type: int16
          unit: 0.1 mV/A
          description: Current sensor scale factor (`batteryMetersConfig()->current.scale`). Stored in 0.1 mV/A; signed for calibration.

        offset:
          type: int16
          unit: mV
          description: Current sensor offset (`batteryMetersConfig()->current.offset`). Signed millivolt adjustment.

        type:
          type: currentSensor_e
          unit: Enum
          description: Enum `currentSensor_e` Type of current sensor hardware

        capacity:
          type: uint16
          unit: mAh (legacy)
          description: 'Battery capacity (constrained 0-65535) (`currentBatteryProfile->capacity.value`). Note: This is legacy, use `MSP2_INAV_BATTERY_CONFIG` for full 32-bit capacity'

  MSP_SET_CURRENT_METER_CONFIG:
    id: 41
    description: Sets the configuration for the current sensor. Expects 7 bytes. Signed values use little-endian two's complement.
    request:
      fields:
        scale:
          type: int16
          unit: 0.1 mV/A
          description: Sets `batteryMetersConfigMutable()->current.scale` (0.1 mV/A, signed).

        offset:
          type: int16
          unit: mV
          description: Sets `batteryMetersConfigMutable()->current.offset` (signed millivolts).

        type:
          type: currentSensor_e
          unit: Enum
          description: Enum `currentSensor_e` Sets `batteryMetersConfigMutable()->current.type`.

        capacity:
          type: uint16
          unit: mAh (legacy)
          description: Sets `currentBatteryProfileMutable->capacity.value` (truncated to 16 bits)
    reply: null

  MSP_MIXER:
    id: 42
    description: Retrieves the mixer type (Legacy, INAV always returns QuadX). This command is largely obsolete. Mixer configuration is handled differently in INAV (presets, custom mixes). See `MSP2_INAV_MIXER`.
    request: null
    reply:
      fields:
        mixerMode:
          type: uint8
          description: Always 3 (QuadX) in INAV for compatibility
          value: 3

  MSP_SET_MIXER:
    id: 43
    description: Sets the mixer type (Legacy, ignored by INAV). Expects 1 byte. Calls `mixerUpdateStateFlags()` for potential side effects related to presets.
    request:
      fields:
        mixerMode:
          type: uint8
          description: Mixer mode to set (ignored by INAV)
    reply: null

  MSP_RX_CONFIG:
    id: 44
    description: Retrieves receiver configuration settings. Some fields are Betaflight compatibility placeholders.
    request: null
    reply:
      fields:
        serialRxProvider:
          type: rxSerialReceiverType_e
          unit: Enum
          description: Enum `rxSerialReceiverType_e`. Serial RX provider (`rxConfig()->serialrx_provider`).

        maxCheck:
          type: uint16
          unit: PWM
          description: Upper channel value threshold for stick commands (`rxConfig()->maxcheck`)

        midRc:
          type: uint16
          unit: PWM
          description: Center channel value (`PWM_RANGE_MIDDLE`, typically 1500)

        minCheck:
          type: uint16
          unit: PWM
          description: Lower channel value threshold for stick commands (`rxConfig()->mincheck`)

        spektrumSatBind:
          type: uint8
          unit: Count/Flag
          description: Spektrum bind pulses (`rxConfig()->spektrum_sat_bind`). 0 if `USE_SPEKTRUM_BIND` disabled.

        rxMinUsec:
          type: uint16
          unit: PWM
          description: Minimum expected pulse width (`rxConfig()->rx_min_usec`)

        rxMaxUsec:
          type: uint16
          unit: PWM
          description: Maximum expected pulse width (`rxConfig()->rx_max_usec`)

        bfCompatRcInterpolation:
          type: uint8
          description: BF compatibility. Always 0
          value: 0

        bfCompatRcInterpolationInt:
          type: uint8
          description: BF compatibility. Always 0
          value: 0

        bfCompatAirModeThreshold:
          type: uint16
          description: BF compatibility. Always 0
          value: 0

        reserved1:
          type: uint8
          description: Reserved/Padding. Always 0
          value: 0

        reserved2:
          type: uint32
          description: Reserved/Padding. Always 0
          value: 0

        reserved3:
          type: uint8
          description: Reserved/Padding. Always 0
          value: 0

        bfCompatFpvCamAngle:
          type: uint8
          description: BF compatibility. Always 0
          value: 0

        receiverType:
          type: rxReceiverType_e
          unit: Enum
          description: Enum `rxReceiverType_e` Receiver type (Parallel PWM, PPM, Serial) ('rxConfig()->receiverType')

  MSP_SET_RX_CONFIG:
    id: 45
    description: Sets receiver configuration settings. Expects 24 bytes.
    request:
      fields:
        serialRxProvider:
          type: rxSerialReceiverType_e
          unit: Enum
          description: Enum `rxSerialReceiverType_e`. Sets `rxConfigMutable()->serialrx_provider`.

        maxCheck:
          type: uint16
          unit: PWM
          description: Sets `rxConfigMutable()->maxcheck`.

        midRc:
          type: uint16
          unit: PWM
          description: Ignored (`PWM_RANGE_MIDDLE` is used)

        minCheck:
          type: uint16
          unit: PWM
          description: Sets `rxConfigMutable()->mincheck`.

        spektrumSatBind:
          type: uint8
          unit: Count/Flag
          description: Sets `rxConfigMutable()->spektrum_sat_bind` (if `USE_SPEKTRUM_BIND`).

        rxMinUsec:
          type: uint16
          unit: PWM
          description: Sets `rxConfigMutable()->rx_min_usec`.

        rxMaxUsec:
          type: uint16
          unit: PWM
          description: Sets `rxConfigMutable()->rx_max_usec`.

        bfCompatRcInterpolation:
          type: uint8
          description: Ignored

        bfCompatRcInterpolationInt:
          type: uint8
          description: Ignored

        bfCompatAirModeThreshold:
          type: uint16
          description: Ignored

        reserved1:
          type: uint8
          description: Ignored

        reserved2:
          type: uint32
          description: Ignored

        reserved3:
          type: uint8
          description: Ignored

        bfCompatFpvCamAngle:
          type: uint8
          description: Ignored

        receiverType:
          type: rxReceiverType_e
          unit: Enum
          description: Enum `rxReceiverType_e` Sets `rxConfigMutable()->receiverType`.
    reply: null

  MSP_LED_COLORS:
    id: 46
    description: Retrieves the HSV color definitions for configurable LED colors. Only available if `USE_LED_STRIP` is defined.
    request: null
    reply:
      repeat: LED_CONFIGURABLE_COLOR_COUNT
      fields:
        hue:
          type: uint16
          description: Hue value (0-359)

        saturation:
          type: uint8
          description: Saturation value (0-255)

        value:
          type: uint8
          description: Value/Brightness (0-255)

  MSP_SET_LED_COLORS:
    id: 47
    description: Sets the HSV color definitions for configurable LED colors. Only available if `USE_LED_STRIP` is defined. Expects `LED_CONFIGURABLE_COLOR_COUNT * 4` bytes.
    request:
      repeat: LED_CONFIGURABLE_COLOR_COUNT
      fields:
        hue:
          type: uint16
          description: Hue value (0-359)

        saturation:
          type: uint8
          description: Saturation value (0-255)

        value:
          type: uint8
          description: Value/Brightness (0-255)
    reply: null

  MSP_LED_STRIP_CONFIG:
    id: 48
    description: Retrieves the configuration for each LED on the strip (legacy packed format). Only available if `USE_LED_STRIP` is defined. Superseded by `MSP2_INAV_LED_STRIP_CONFIG_EX` which uses a clearer struct.
    request: null
    reply:
      repeat: LED_MAX_STRIP_LENGTH
      fields:
        legacyLedConfig:
          type: uint32
          description: Packed LED configuration (position, function, overlay, color, direction, params). See C code for bit packing details

  MSP_SET_LED_STRIP_CONFIG:
    id: 49
    description: Sets the configuration for a single LED on the strip using the legacy packed format. Only available if `USE_LED_STRIP` is defined. Expects 5 bytes. Calls `reevaluateLedConfig()`. Superseded by `MSP2_INAV_SET_LED_STRIP_CONFIG_EX`.
    request:
      fields:
        ledIndex:
          type: uint8
          description: Index of the LED to configure (0 to `LED_MAX_STRIP_LENGTH - 1`)

        legacyLedConfig:
          type: uint32
          description: Packed LED configuration to set
    reply: null

  MSP_RSSI_CONFIG:
    id: 50
    description: Retrieves the channel used for analog RSSI input.
    request: null
    reply:
      fields:
        rssiChannel:
          type: uint8
          description: AUX channel index (1-based) used for RSSI, or 0 if disabled (`rxConfig()->rssi_channel`)

  MSP_SET_RSSI_CONFIG:
    id: 51
    description: Sets the channel used for analog RSSI input. Expects 1 byte. Input value is constrained 0 to `MAX_SUPPORTED_RC_CHANNEL_COUNT`. Updates the effective RSSI source.
    request:
      fields:
        rssiChannel:
          type: uint8
          description: AUX channel index (1-based) to use for RSSI, or 0 to disable
    reply: null

  MSP_ADJUSTMENT_RANGES:
    id: 52
    description: Returns all defined RC adjustment ranges (tuning via aux channels). See `adjustmentRange_t`.
    request: null
    reply:
      repeat: MAX_ADJUSTMENT_RANGE_COUNT
      fields:
        adjustmentIndex:
          type: uint8
          description: Index of the adjustment slot (0 to `MAX_SIMULTANEOUS_ADJUSTMENT_COUNT - 1`)

        auxChannelIndex:
          type: uint8
          description: 0-based index of the AUX channel controlling the adjustment value

        rangeStartStep:
          type: uint8
          unit: step
          description: Start step (0-48). Each step is 25 PWM units; 0 is <=900 and 48 is >=2100.

        rangeEndStep:
          type: uint8
          unit: step
          description: End step (0-48). Uses the same 25-PWM step mapping as rangeStartStep.

        adjustmentFunction:
          type: adjustmentFunction_e
          description: Function/parameter being adjusted (see `adjustmentFunction_e`).

        auxSwitchChannelIndex:
          type: uint8
          description: 0-based index of the AUX channel acting as an enable switch (or 0 if always enabled)

  MSP_SET_ADJUSTMENT_RANGE:
    id: 53
    description: Sets a single RC adjustment range configuration by its index. Expects 7 bytes. Returns error if `rangeIndex` or `adjustmentIndex` is invalid.
    request:
      fields:
        rangeIndex:
          type: uint8
          description: Index of the adjustment range to set (0 to `MAX_ADJUSTMENT_RANGE_COUNT - 1`)

        adjustmentIndex:
          type: uint8
          description: Adjustment slot index (0 to `MAX_SIMULTANEOUS_ADJUSTMENT_COUNT - 1`)

        auxChannelIndex:
          type: uint8
          description: 0-based index of the control AUX channel

        rangeStartStep:
          type: uint8
          unit: step
          description: Start step (0-48). Each step is 25 PWM units; 0 is <=900 and 48 is >=2100.

        rangeEndStep:
          type: uint8
          unit: step
          description: End step (0-48). Uses the same 25-PWM step mapping as rangeStartStep.

        adjustmentFunction:
          type: adjustmentFunction_e
          description: Function/parameter being adjusted.

        auxSwitchChannelIndex:
          type: uint8
          description: 0-based index of the enable switch AUX channel (or 0)
    reply: null

  MSP_CF_SERIAL_CONFIG:
    id: 54
    description: NOT IMPLEMENTED. Deprecated command to get serial port configuration. Not implemented in INAV `fc_msp.c`. Use `MSP2_COMMON_SERIAL_CONFIG`.
    request: null
    reply: null

  MSP_SET_CF_SERIAL_CONFIG:
    id: 55
    description: NOT IMPLEMENTED. Deprecated command to set serial port configuration. Not implemented in INAV `fc_msp.c`. Use `MSP2_COMMON_SET_SERIAL_CONFIG`.
    request: null
    reply: null

  MSP_VOLTAGE_METER_CONFIG:
    id: 56
    description: Retrieves legacy voltage meter configuration (scaled values). Superseded by `MSP2_INAV_BATTERY_CONFIG`.
    request: null
    reply:
      fields:
        vbatScale:
          type: uint8
          unit: Scale / 10
          description: Voltage sensor scale factor / 10 (`batteryMetersConfig()->voltage.scale / 10`). 0 if `USE_ADC` disabled

        vbatMinCell:
          type: uint8
          unit: 0.1V
          description: Minimum cell voltage / 10 (`currentBatteryProfile->voltage.cellMin / 10`). 0 if `USE_ADC` disabled

        vbatMaxCell:
          type: uint8
          unit: 0.1V
          description: Maximum cell voltage / 10 (`currentBatteryProfile->voltage.cellMax / 10`). 0 if `USE_ADC` disabled

        vbatWarningCell:
          type: uint8
          unit: 0.1V
          description: Warning cell voltage / 10 (`currentBatteryProfile->voltage.cellWarning / 10`). 0 if `USE_ADC` disabled

  MSP_SET_VOLTAGE_METER_CONFIG:
    id: 57
    description: Sets legacy voltage meter configuration (scaled values). Expects 4 bytes. Superseded by `MSP2_INAV_SET_BATTERY_CONFIG`.
    request:
      fields:
        vbatScale:
          type: uint8
          unit: Scale / 10
          description: Sets `batteryMetersConfigMutable()->voltage.scale = value * 10` (if `USE_ADC`)

        vbatMinCell:
          type: uint8
          unit: 0.1V
          description: Sets `currentBatteryProfileMutable->voltage.cellMin = value * 10` (if `USE_ADC`)

        vbatMaxCell:
          type: uint8
          unit: 0.1V
          description: Sets `currentBatteryProfileMutable->voltage.cellMax = value * 10` (if `USE_ADC`)

        vbatWarningCell:
          type: uint8
          unit: 0.1V
          description: Sets `currentBatteryProfileMutable->voltage.cellWarning = value * 10` (if `USE_ADC`)
    reply: null

  MSP_SONAR_ALTITUDE:
    id: 58
    description: Retrieves the altitude measured by the primary rangefinder (sonar or lidar).
    request: null
    reply:
      fields:
        rangefinderAltitude:
          type: int32
          unit: cm
          description: Latest altitude reading from the rangefinder (`rangefinderGetLatestAltitude()`). 0 if `USE_RANGEFINDER` disabled or no reading.

  MSP_RX_MAP:
    id: 64
    description: Retrieves the RC channel mapping array (AETR, etc.). `MAX_MAPPABLE_RX_INPUTS` is currently 4 (Roll, Pitch, Yaw, Throttle).
    request: null
    reply:
      fields:
        rcMap:
          type: uint8[MAX_MAPPABLE_RX_INPUTS]
          description: Array defining the mapping from input channel index to logical function (Roll, Pitch, Yaw, Throttle, Aux1...)

  MSP_SET_RX_MAP:
    id: 65
    description: Sets the RC channel mapping array. Expects `MAX_MAPPABLE_RX_INPUTS` bytes (currently 4).
    request:
      fields:
        rcMap:
          type: uint8[MAX_MAPPABLE_RX_INPUTS]
          description: Array defining the new channel mapping
    reply: null

  MSP_REBOOT:
    id: 68
    description: Commands the flight controller to reboot. The FC sends an ACK *before* rebooting. The `mspPostProcessFn` is set to `mspRebootFn` to perform the reboot after the reply is sent. Will fail if the craft is armed.
    request: null
    reply: null

  MSP_DATAFLASH_SUMMARY:
    id: 70
    description: Retrieves summary information about the onboard dataflash chip (if present and used for Blackbox via FlashFS). Requires `USE_FLASHFS`.
    request: null
    reply:
      fields:
        flashReady:
          type: uint8
          description: 'Boolean: 1 if flash chip is ready, 0 otherwise. (`flashIsReady()`). 0 if `USE_FLASHFS` disabled'

        sectorCount:
          type: uint32
          description: Total number of sectors on the flash chip (`geometry->sectors`). 0 if `USE_FLASHFS` disabled

        totalSize:
          type: uint32
          description: Total size of the flash chip in bytes (`geometry->totalSize`). 0 if `USE_FLASHFS` disabled

        usedSize:
          type: uint32
          description: Currently used size in bytes (FlashFS offset) (`flashfsGetOffset()`). 0 if `USE_FLASHFS` disabled

  MSP_DATAFLASH_READ:
    id: 71
    description: Reads a block of data from the onboard dataflash (FlashFS). Requires `USE_FLASHFS`. Read length may be truncated by buffer size or end of flashfs volume.
    request:
      fields:
        address:
          type: uint32
          description: Starting address to read from within the FlashFS volume

        size:
          type: optional uint16
          description: (Optional) Number of bytes to read. Defaults to 128 if not provided
    reply:
      fields:

        address:
          type: uint32
          description: The starting address from which data was actually read

        data:
          type: uint8[]
          description: The data read from flash. Length is MIN(requested size, remaining buffer space, remaining flashfs data)

  MSP_DATAFLASH_ERASE:
    id: 72
    description: Erases the entire onboard dataflash chip (FlashFS volume). Requires `USE_FLASHFS`. This is a potentially long operation. Use with caution.
    request: null
    reply: null

  MSP_LOOP_TIME:
    id: 73
    description: Retrieves the configured loop time (PID loop frequency denominator). This is the *configured* target loop time, not necessarily the *actual* measured cycle time (see `MSP_STATUS`).
    request: null
    reply:
      fields:
        looptime:
          type: uint16
          unit: PWM
          description: Configured loop time (`gyroConfig()->looptime`)

  MSP_SET_LOOP_TIME:
    id: 74
    description: Sets the configured loop time. Expects 2 bytes.
    request:
      fields:
        looptime:
          type: uint16
          unit: PWM
          description: New loop time to set (`gyroConfigMutable()->looptime`)
    reply: null

  MSP_FAILSAFE_CONFIG:
    id: 75
    description: Retrieves the failsafe configuration settings.
    request: null
    reply:
      fields:
        failsafeDelay:
          type: uint8
          unit: 0.1s
          description: Delay before failsafe stage 1 activates (`failsafeConfig()->failsafe_delay`)

        failsafeOffDelay:
          type: uint8
          unit: 0.1s
          description: Delay after signal recovery before returning control (`failsafeConfig()->failsafe_off_delay`)

        failsafeThrottle:
          type: uint16
          unit: PWM
          description: Throttle level during failsafe stage 2 (`currentBatteryProfile->failsafe_throttle`)

        legacyKillSwitch:
          type: uint8
          description: Legacy flag, always 0
          value: 0

        failsafeThrottleLowDelay:
          type: uint16
          unit: 0.1s
          description: Delay for throttle-based failsafe detection (`failsafeConfig()->failsafe_throttle_low_delay`). Units of 0.1 seconds.

        failsafeProcedure:
          type: failsafeProcedure_e
          unit: Enum
          description: Enum `failsafeProcedure_e` Failsafe procedure (Drop, RTH, Land, etc.) ('failsafeConfig()->failsafe_procedure')

        failsafeRecoveryDelay:
          type: uint8
          unit: 0.1s
          description: Delay after RTH finishes before attempting recovery (`failsafeConfig()->failsafe_recovery_delay`)

        failsafeFWRollAngle:
          type: int16
          unit: deci-degrees
          description: Fixed-wing failsafe roll angle (`failsafeConfig()->failsafe_fw_roll_angle`). Signed deci-degrees.

        failsafeFWPitchAngle:
          type: int16
          unit: deci-degrees
          description: Fixed-wing failsafe pitch angle (`failsafeConfig()->failsafe_fw_pitch_angle`). Signed deci-degrees.

        failsafeFWYawRate:
          type: int16
          unit: deg/s
          description: Fixed-wing failsafe yaw rate (`failsafeConfig()->failsafe_fw_yaw_rate`). Signed degrees per second.

        failsafeStickThreshold:
          type: uint16
          unit: PWM units
          description: Stick movement threshold to exit failsafe (`failsafeConfig()->failsafe_stick_motion_threshold`)

        failsafeMinDistance:
          type: uint16
          unit: cm
          description: Minimum distance from home for RTH failsafe (`failsafeConfig()->failsafe_min_distance`). Units of centimeters.

        failsafeMinDistanceProc:
          type: failsafeProcedure_e
          unit: Enum
          description: Enum `failsafeProcedure_e` Failsafe procedure if below min distance ('failsafeConfig()->failsafe_min_distance_procedure')

  MSP_SET_FAILSAFE_CONFIG:
    id: 76
    description: Sets the failsafe configuration settings. Expects 20 bytes.
    request:
      fields:
        failsafeDelay:
          type: uint8
          unit: 0.1s
          description: Sets `failsafeConfigMutable()->failsafe_delay`.

        failsafeOffDelay:
          type: uint8
          unit: 0.1s
          description: Sets `failsafeConfigMutable()->failsafe_off_delay`.

        failsafeThrottle:
          type: uint16
          unit: PWM
          description: Sets `currentBatteryProfileMutable->failsafe_throttle`.

        legacyKillSwitch:
          type: uint8
          description: Ignored

        failsafeThrottleLowDelay:
          type: uint16
          unit: 0.1s
          description: Sets `failsafeConfigMutable()->failsafe_throttle_low_delay`. Units of 0.1 seconds.

        failsafeProcedure:
          type: failsafeProcedure_e
          unit: Enum
          description: Enum `failsafeProcedure_e`. Sets `failsafeConfigMutable()->failsafe_procedure`.

        failsafeRecoveryDelay:
          type: uint8
          unit: 0.1s
          description: Sets `failsafeConfigMutable()->failsafe_recovery_delay`.

        failsafeFWRollAngle:
          type: int16
          unit: deci-degrees
          description: Sets `failsafeConfigMutable()->failsafe_fw_roll_angle`. Signed deci-degrees.

        failsafeFWPitchAngle:
          type: int16
          unit: deci-degrees
          description: Sets `failsafeConfigMutable()->failsafe_fw_pitch_angle`. Signed deci-degrees.

        failsafeFWYawRate:
          type: int16
          unit: deg/s
          description: Sets `failsafeConfigMutable()->failsafe_fw_yaw_rate`. Signed degrees per second.

        failsafeStickThreshold:
          type: uint16
          unit: PWM units
          description: Sets `failsafeConfigMutable()->failsafe_stick_motion_threshold`.

        failsafeMinDistance:
          type: uint16
          unit: cm
          description: Sets `failsafeConfigMutable()->failsafe_min_distance`. Units of centimeters.

        failsafeMinDistanceProc:
          type: failsafeProcedure_e
          unit: Enum
          description: Enum `failsafeProcedure_e`. Sets `failsafeConfigMutable()->failsafe_min_distance_procedure`.
    reply: null

  MSP_SDCARD_SUMMARY:
    id: 79
    description: Retrieves summary information about the SD card status and filesystem. Requires `USE_SDCARD` and `USE_ASYNCFATFS`.
    request: null
    reply:
      fields:
        sdCardSupported:
          type: uint8
          unit: Bitmask
          description: 'Bitmask: Bit 0 = 1 if SD card support compiled in (`USE_SDCARD`)'

        sdCardState:
          type: mspSDCardState_e
          description: 'Enum (`mspSDCardState_e`): Current state (Not Present, Fatal, Card Init, FS Init, Ready). 0 if `USE_SDCARD` disabled'

        fsError:
          type: uint8
          description: Last filesystem error code (`afatfs_getLastError()`). 0 if `USE_SDCARD` disabled

        freeSpaceKB:
          type: uint32
          description: Free space in KiB (`afatfs_getContiguousFreeSpace() / 1024`). 0 if `USE_SDCARD` disabled

        totalSpaceKB:
          type: uint32
          description: Total space in KiB (`sdcard_getMetadata()->numBlocks / 2`). 0 if `USE_SDCARD` disabled

  MSP_BLACKBOX_CONFIG:
    id: 80
    description: Legacy command to retrieve Blackbox configuration. Superseded by `MSP2_BLACKBOX_CONFIG`. Returns fixed zero values. Use `MSP2_BLACKBOX_CONFIG`. Replaced by MSP2_BLACKBOX_CONFIG.
    request: null
    reply:
      fields:
        blackboxDevice:
          type: uint8
          description: Always 0 (API no longer supported)
          value: 0

        blackboxRateNum:
          type: uint8
          description: Always 0
          value: 0

        blackboxRateDenom:
          type: uint8
          description: Always 0
          value: 0

        blackboxPDenom:
          type: uint8
          description: Always 0
          value: 0

  MSP_SET_BLACKBOX_CONFIG:
    id: 81
    description: NOT IMPLEMENTED. Legacy command to set Blackbox configuration. Superseded by `MSP2_SET_BLACKBOX_CONFIG`. Not implemented in `fc_msp.c`. Use `MSP2_SET_BLACKBOX_CONFIG`. Replaced by MSP2_SET_BLACKBOX_CONFIG.
    request: null
    reply: null

  MSP_TRANSPONDER_CONFIG:
    id: 82
    description: NOT IMPLEMENTED. Get VTX Transponder settings (likely specific to RaceFlight/Betaflight, not standard INAV VTX). Not implemented in INAV `fc_msp.c`.
    request: null
    reply: null

  MSP_SET_TRANSPONDER_CONFIG:
    id: 83
    description: NOT IMPLEMENTED. Set VTX Transponder settings. Not implemented in INAV `fc_msp.c`.
    request: null
    reply: null

  MSP_OSD_CONFIG:
    id: 84
    description: Retrieves OSD configuration settings and layout for screen 0. Coordinates are packed as `(Y << 8) | X`. When `USE_OSD` is not compiled in, only `osdDriverType` = `OSD_DRIVER_NONE` is returned. 1 byte if `USE_OSD` disabled; full payload (1 + fields + 2*OSD_ITEM_COUNT bytes) otherwise. Replaced by MSP2_INAV_OSD_LAYOUTS, MSP2_INAV_OSD_ALARMS, MSP2_INAV_OSD_PREFERENCES.
    request: null
    reply:
      fields:
        osdDriverType:
          type: osdDriver_e
          unit: Enum
          description: 'Enum `osdDriver_e`: `OSD_DRIVER_MAX7456` if `USE_OSD`, else `OSD_DRIVER_NONE`.'

        videoSystem:
          type: videoSystem_e
          unit: Enum
          description: 'Enum `videoSystem_e`: Video system (Auto/PAL/NTSC) (`osdConfig()->video_system`). Sent even if OSD disabled'

        units:
          type: osd_unit_e
          unit: Enum
          description: Enum `osd_unit_e` Measurement units (Metric/Imperial) (`osdConfig()->units`). Sent even if OSD disabled

        rssiAlarm:
          type: uint8
          unit: '%'
          description: RSSI alarm threshold (`osdConfig()->rssi_alarm`). Sent even if OSD disabled

        capAlarm:
          type: uint16
          unit: mAh/mWh
          description: Capacity alarm threshold (`currentBatteryProfile->capacity.warning`). Truncated to 16 bits. Sent even if OSD disabled.

        timerAlarm:
          type: uint16
          unit: minutes
          description: Timer alarm threshold in minutes (`osdConfig()->time_alarm`). Sent even if OSD disabled.

        altAlarm:
          type: uint16
          unit: meters
          description: Altitude alarm threshold (`osdConfig()->alt_alarm`). Sent even if OSD disabled

        distAlarm:
          type: uint16
          unit: meters
          description: Distance alarm threshold (`osdConfig()->dist_alarm`). Sent even if OSD disabled

        negAltAlarm:
          type: uint16
          unit: meters
          description: Negative altitude alarm threshold (`osdConfig()->neg_alt_alarm`). Sent even if OSD disabled

        itemPositions:
          type: uint16[]
          unit: packed
          description: Packed X/Y position for each OSD item on screen 0 (`osdLayoutsConfig()->item_pos[0][i]`). Sent even if OSD disabled

  MSP_SET_OSD_CONFIG:
    id: 85
    description: 'Sets OSD configuration or a single item''s position on screen 0. Requires `USE_OSD`. Distinguishes formats based on the first byte. Format 1 requires at least 10 bytes. Format 2 requires 3 bytes. Triggers an OSD redraw. See `MSP2_INAV_OSD_SET_*` for more advanced control. Replaced by MSP2_INAV_OSD_SET_LAYOUT_ITEM, MSP2_INAV_OSD_SET_ALARMS, MSP2_INAV_OSD_SET_PREFERENCES. Length-dispatched variants: dataSize >= 10; dataSize == 3.'
    request: null
    reply: null

  MSP_OSD_CHAR_READ:
    id: 86
    description: NOT IMPLEMENTED. Reads character data from the OSD font memory. Not implemented in INAV `fc_msp.c`. Requires direct hardware access, typically done via DisplayPort.
    request: null
    reply: null

  MSP_OSD_CHAR_WRITE:
    id: 87
    description: 'Writes character data to the OSD font memory. Requires `USE_OSD`. Minimum payload is `OSD_CHAR_VISIBLE_BYTES + 1` (8-bit address + 54 bytes). Payload size determines the address width and whether the extra metadata bytes are present. Writes characters via `displayWriteFontCharacter()`. Length-dispatched variants: payloadSize >= OSD_CHAR_BYTES + 2 (>=66 bytes); payloadSize == OSD_CHAR_BYTES + 1 (65 bytes); payloadSize == OSD_CHAR_VISIBLE_BYTES + 2 (56 bytes); payloadSize == OSD_CHAR_VISIBLE_BYTES + 1 (55 bytes).'
    request: null
    reply: null

  MSP_VTX_CONFIG:
    id: 88
    description: Retrieves the current VTX (Video Transmitter) configuration and capabilities. Returns 1 byte (`VTXDEV_UNKNOWN`) when no VTX is detected or `USE_VTX_CONTROL` is disabled; otherwise sends full payload. BF compatibility field `frequency` (uint16) is missing compared to some BF versions. Use `MSP_VTXTABLE_BAND` and `MSP_VTXTABLE_POWERLEVEL` for details.
    request: null
    reply:
      fields:
        vtxDeviceType:
          type: vtxDevType_e
          description: 'Enum (`vtxDevType_e`): Type of VTX device detected/configured. `VTXDEV_UNKNOWN` if none'

        band:
          type: uint8
          description: VTX band number (from `vtxSettingsConfig`)

        channel:
          type: uint8
          description: VTX channel number (from `vtxSettingsConfig`)

        power:
          type: uint8
          description: VTX power level index (from `vtxSettingsConfig()`).

        pitMode:
          type: uint8
          description: 'Boolean: 1 if VTX is currently in pit mode, 0 otherwise.'

        vtxReady:
          type: uint8
          description: 'Boolean: 1 if VTX device reported ready, 0 otherwise'

        lowPowerDisarm:
          type: vtxLowerPowerDisarm_e
          unit: Enum
          description: 'Enum `vtxLowerPowerDisarm_e`: Low-power behaviour while disarmed (`vtxSettingsConfig()->lowPowerDisarm`).'

        vtxTableAvailable:
          type: uint8
          description: 'Boolean: 1 if VTX tables (band/power) are available for query'

        bandCount:
          type: uint8
          description: Number of bands supported by the VTX device

        channelCount:
          type: uint8
          description: Number of channels per band supported by the VTX device

        powerCount:
          type: uint8
          description: Number of power levels supported by the VTX device

  MSP_SET_VTX_CONFIG:
    id: 89
    description: 'Sets VTX band/channel and related options. Fields are a progressive superset based on payload length. Requires dataSize >= 2. If no VTX device or device type is VTXDEV_UNKNOWN, fields are read and discarded. The first uint16 is interpreted as band/channel when value <= VTXCOMMON_MSP_BANDCHAN_CHKVAL, otherwise treated as a frequency value that is not applied by this path. Subsequent fields are applied only if present. If dataSize < 2 the command returns MSP_RESULT_ERROR. Length-dispatched variants: payloadSize >= 14; payloadSize >= 11; payloadSize >= 9; payloadSize >= 7; payloadSize >= 5; payloadSize >= 4; payloadSize == 2.'
    request: null
    reply: null

  MSP_ADVANCED_CONFIG:
    id: 90
    description: Retrieves advanced hardware-related configuration (PWM protocols, rates). Some fields are BF compatibility placeholders.
    request: null
    reply:
      fields:
        gyroSyncDenom:
          type: uint8
          description: Always 1 (BF compatibility)
          value: 1

        pidProcessDenom:
          type: uint8
          description: Always 1 (BF compatibility)
          value: 1

        useUnsyncedPwm:
          type: uint8
          description: Always 1 (BF compatibility, INAV uses async PWM based on protocol)
          value: 1

        motorPwmProtocol:
          type: motorPwmProtocolTypes_e
          unit: Enum
          description: Motor PWM protocol type (`motorConfig()->motorPwmProtocol`).

        motorPwmRate:
          type: uint16
          unit: Hz
          description: Motor PWM rate (if applicable) (`motorConfig()->motorPwmRate`).

        servoPwmRate:
          type: uint16
          unit: Hz
          description: Servo PWM rate (`servoConfig()->servoPwmRate`).

        legacyGyroSync:
          type: uint8
          description: Always 0 (BF compatibility)
          value: 0

  MSP_SET_ADVANCED_CONFIG:
    id: 91
    description: Sets advanced hardware-related configuration (PWM protocols, rates). Expects 9 bytes.
    request:
      fields:
        gyroSyncDenom:
          type: uint8
          description: Ignored (legacy Betaflight field).

        pidProcessDenom:
          type: uint8
          description: Ignored (legacy Betaflight field).

        useUnsyncedPwm:
          type: uint8
          description: Ignored (legacy Betaflight field).

        motorPwmProtocol:
          type: motorPwmProtocolTypes_e
          unit: Enum
          description: Sets `motorConfigMutable()->motorPwmProtocol`.

        motorPwmRate:
          type: uint16
          unit: Hz
          description: Sets `motorConfigMutable()->motorPwmRate`.

        servoPwmRate:
          type: uint16
          unit: Hz
          description: Sets `servoConfigMutable()->servoPwmRate`.

        legacyGyroSync:
          type: uint8
          description: Ignored (legacy Betaflight field).
    reply: null

  MSP_FILTER_CONFIG:
    id: 92
    description: Retrieves filter configuration settings (Gyro, D-term, Yaw, Accel). Some fields are BF compatibility placeholders or legacy. Replaced by MSP2_COMMON_SETTING.
    request: null
