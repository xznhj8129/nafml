          unit: Hz
          description: Yaw low-pass filter cutoff frequency (`pidProfile()->yaw_lpf_hz`)

        legacyGyroNotchHz:
          type: uint16
          description: Always 0 (Legacy)
          value: 0

        legacyGyroNotchCutoff:
