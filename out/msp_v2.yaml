          description: Always 0 (Legacy)
          value: 0

  MSP_SET_FILTER_CONFIG:
    id: 93
    description: Sets filter configuration settings. Handles different payload lengths for backward compatibility. Requires at least 22 bytes; intermediate length checks enforce legacy Betaflight frame layout and call `pidInitFilters()` once the D-term notch placeholders are consumed. Replaced by MSP2_COMMON_SET_SETTING.
